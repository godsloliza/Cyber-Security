services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=prawee
      - POSTGRES_PASSWORD=1p@ssw0rd
      - POSTGRES_DB=prawee

  admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    ports:
      - 8080:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@prawee.com
      - PGADMIN_DEFAULT_PASSWORD=1p@ssw0rd
    depends_on:
      - db
